version: '3.8'

services:
  app:
    build: .
    container_name: life-30000-days
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/database.sqlite
      - JWT_SECRET=your-production-secret-key-change-this
